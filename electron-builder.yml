{
  "appId": "cn.zhixing.office",
  "productName": "知行",
  "asar": false,
  "directories": {
    "output": "release"
  },
  "electronDist": "node_modules/electron/dist",
  "files": [
    "dist/client/**/*",
    "electron/**/*",
    "harness/**/*",
    "src/privacy-core.js",
    "src/privacy-recognizers.js",
    "src/privacy-policy.js",
    "src/project-core.js",
    "src/permissions.js",
    "src/store.js",
    "src/conversation-state.js",
    "src/session-commands.js",
    "src/provider-options.js",
    "src/scheduler.js",
    "src/automation-core.js",
    "src/office-workflows.js",
    "src/kernel-config.js",
    "src/team-board.js",
    "package.json",
    "!node_modules/**/*"
  ],
  "afterPack": "./scripts/pack-runtime.cjs",
  "npmRebuild": false,
  "win": {
    "icon": "public/brand/zhixing.ico",
    "target": [
      {
        "target": "nsis",
        "arch": [
          "x64"
        ]
      }
    ],
    "artifactName": "ZhiXing-${version}-${arch}.${ext}"
  },
  "publish": {
    "provider": "github",
    "owner": "daniei-chen",
    "repo": "ZhiXing",
    "releaseType": "prerelease"
  },
  "nsis": {
    "oneClick": false,
    "allowToChangeInstallationDirectory": true,
    "include": "installer.nsh",
    "createDesktopShortcut": true,
    "installerIcon": "public/brand/zhixing.ico",
    "uninstallerIcon": "public/brand/zhixing.ico",
    "installerHeaderIcon": "public/brand/zhixing.ico"
  },
  "extraMetadata": {
    "main": "electron/main.cjs"
  }
}
